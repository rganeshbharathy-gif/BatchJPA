# ============================================================
#  DataSource – Oracle (replace placeholders before running)
# ============================================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=BATCH_USER
spring.datasource.password=BATCH_PASS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP – Oracle-specific connection validation
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
#  JPA / Hibernate 6
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Suppress "HHH90000022" non-proxy warning on Hibernate 6
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ============================================================
#  Spring Batch 5 metadata schema
# ============================================================
# "always" creates/updates the Batch meta tables on startup.
# Use "never" once the schema is already present in production.
spring.batch.jdbc.initialize-schema=always

# Do NOT run the job automatically on startup – launch it explicitly
spring.batch.job.enabled=false

# ============================================================
#  Application-level Batch configuration
# ============================================================
# Default field delimiter in the input flat file
batch.file.delimiter=|

# Chunk size (number of records per transaction)
batch.chunk.size=500

# ============================================================
#  Logging
# ============================================================
logging.level.org.springframework.batch=INFO
logging.level.com.example.batchjpa=DEBUG
logging.level.org.hibernate.SQL=WARN
